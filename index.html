<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>ナレッジ</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🍓 ナレッジ</h1>
      <input id="q" type="search" placeholder="フリーワード検索..." />
    </header>
    <div class="layout">
      <div class="nav-area">
        <button id="menuToggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="mainNav">
          ☰ メニューを開く
        </button>
        <nav id="mainNav" class="nav">
          <ul id="menu"></ul>
        </nav>
      </div>
      <main>
        <div id="status" class="status"></div>
        <div id="cards" class="cards"></div>
      </main>
    </div>
  </div>

  <script>
    let data = { categories: [], items: [] };
    let catFilter = "all";
    let itemFilter = null;
    let query = "";
    let initializedOpen = false;
    let isMenuOpen = false;
    let searchJumpTimer = null;
    const openCats = new Set();

    const MOBILE_QUERY = "(max-width: 768px)";
    const isMobile = () => window.matchMedia(MOBILE_QUERY).matches;
    const catLabel = (id) => data.categories.find((c) => c.id === id)?.label || id;

    function syncMenuVisibility() {
      const toggleBtn = document.getElementById("menuToggle");
      const nav = document.getElementById("mainNav");
      if (!toggleBtn || !nav) return;

      if (!isMobile()) {
        nav.classList.remove("is-collapsed");
        toggleBtn.setAttribute("aria-expanded", "true");
        return;
      }

      nav.classList.toggle("is-collapsed", !isMenuOpen);
      toggleBtn.setAttribute("aria-expanded", String(isMenuOpen));
      toggleBtn.textContent = isMenuOpen ? "✕ メニューを閉じる" : "☰ メニューを開く";
    }

    function initDefaultOpenState() {
      if (initializedOpen) return;
      initializedOpen = true;
      // PCは初回全開、スマホは閉じて省スペース化
      if (!isMobile()) {
        data.categories.forEach((c) => openCats.add(c.id));
      }
    }

    function addBtn(ul, label, active, onClick) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nav-btn" + (active ? " active" : "");
      btn.textContent = label;
      btn.onclick = onClick;
      li.appendChild(btn);
      ul.appendChild(li);
      return li;
    }

    function renderMenu() {
      initDefaultOpenState();
      syncMenuVisibility();

      const menu = document.getElementById("menu");
      menu.innerHTML = "";

      addBtn(menu, "✨ すべて", catFilter === "all" && !itemFilter, () => {
        catFilter = "all";
        itemFilter = null;
        if (isMobile()) isMenuOpen = false;
        render();
      });

      data.categories.forEach((c) => {
        const children = data.items.filter(
          (i) => i.category === c.id && i.parent === c.label
        );

        if (!children.length) {
          addBtn(menu, c.label, catFilter === c.id && !itemFilter, () => {
            catFilter = c.id;
            itemFilter = null;
            if (isMobile()) isMenuOpen = false;
            render();
          });
          return;
        }

        const li = document.createElement("li");
        const details = document.createElement("details");
        details.open = openCats.has(c.id);

        const summary = document.createElement("summary");
        summary.textContent = c.label;
        summary.className =
          "nav-btn" + (catFilter === c.id && !itemFilter ? " active" : "");

        summary.addEventListener("click", (e) => {
          e.preventDefault();
          const nextOpen = !details.open;
          if (nextOpen) {
            openCats.add(c.id);
          } else {
            openCats.delete(c.id);
          }
          catFilter = c.id;
          itemFilter = null;
          render();
        });

        const sub = document.createElement("ul");
        sub.className = "sub";
        children.forEach((ch) => {
          addBtn(sub, " " + ch.title, itemFilter === ch.id, () => {
            catFilter = c.id;
            itemFilter = ch.id;
            openCats.add(c.id);
            if (isMobile()) isMenuOpen = false;
            render(ch.id);
          });
        });

        details.appendChild(summary);
        details.appendChild(sub);
        li.appendChild(details);
        menu.appendChild(li);
      });
    }

    function getFilteredItems() {
      const q = query.toLowerCase();
      return data.items.filter((it) => {
        if (itemFilter) return it.id === itemFilter;
        if (catFilter !== "all" && it.category !== catFilter) return false;
        if (!q) return true;
        return [it.title, it.body, it.parent || "", catLabel(it.category), ...(it.tags || [])]
          .join(" ").toLowerCase().includes(q);
      });
    }

    function jumpToCard(id) {
      if (!id) return;
      requestAnimationFrame(() => {
        const target = document.getElementById(`card-${id}`);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    }

    function render(scrollToId = null) {
      renderMenu();
      const list = getFilteredItems();

      document.getElementById("status").textContent = `表示中: ${list.length}件`;
      document.getElementById("cards").innerHTML = list.length
        ? list.map((it) => `
            <article class="card">
              <button type="button" class="badge badge-btn" data-cat="${it.category}">
                ${it.parent ? `${catLabel(it.category)} / ${it.title}` : catLabel(it.category)}
              </button>
              <h2>${it.title}</h2>
              <p>${it.body}</p>
            </article>
          `).join("")
        : `<div class="card">該当するメモがありません</div>`;

      if (scrollToId) {
        jumpToCard(scrollToId);
      }
    }

    document.getElementById("cards").addEventListener("click", (e) => {
      const btn = e.target.closest(".badge-btn");
      if (!btn) return;
      const nextCat = btn.dataset.cat;
      if (!nextCat) return;

      // すでに同じカテゴリで絞り込み中なら「すべて」に戻す（トグル動作）
      if (catFilter === nextCat && !itemFilter) {
        catFilter = "all";
      } else {
        catFilter = nextCat;
        itemFilter = null;
      }
      render();
    });

    document.getElementById("menuToggle").addEventListener("click", () => {
      isMenuOpen = !isMenuOpen;
      syncMenuVisibility();
    });

    window.addEventListener("resize", () => {
      syncMenuVisibility();
    });

    const qInput = document.getElementById("q");

    qInput.addEventListener("input", (e) => {
      query = e.target.value.trim();
      render();

      clearTimeout(searchJumpTimer);
      if (query) {
        searchJumpTimer = setTimeout(() => {
          const matched = getFilteredItems();
          if (matched.length) jumpToCard(matched[0].id);
        }, 350);
      }
    });

    qInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && query) {
        clearTimeout(searchJumpTimer);
        const matched = getFilteredItems();
        if (matched.length) jumpToCard(matched[0].id);
      }
    });

    fetch("./memos.json?_=" + Date.now())
      .then((r) => r.json())
      .then((json) => { data = json; render(); });
  </script>
</body>
</html>
